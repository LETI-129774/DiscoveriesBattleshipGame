name: Notificar Revisor do Pull Request

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notificar:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Publicar comentário de notificação no PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            
            // Mensagem automática a ser colocada no PR
            const body = `👋 **Aviso de Revisão de Código**\n\n` +
                         `O colega **@${author}** submeteu este Pull Request!\n\n` +
                         `📌 **Colegas de grupo:** Por favor, revejam as alterações no separador *Files changed*, façam os comentários necessários e concluam o *Merge* assim que estiver aprovado.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
